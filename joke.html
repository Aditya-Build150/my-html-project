<!DOCTYPE html>
<html>
<head>
    <title>Random Joke Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 500px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
        
        #joke {
            font-size: 18px;
            color: #555;
            margin: 20px 0;
            min-height: 60px;
            line-height: 1.6;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        
        button:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>😂 Joke Generator</h1>
        <p id="joke">Click the button to get a joke!</p>
        <button id="jokeBtn">Get a Joke</button>
    </div>

    <script>
        const jokes = [
            "Why don't scientists trust atoms? Because they make up everything!",
            "What do you call a fake noodle? An impasta!",
            "Why did the scarecrow win an award? He was outstanding in his field!",
            "What's the best thing about Switzerland? I don't know, but the flag is a big plus.",
            "Why don't eggs tell jokes? They'd crack each other up!",
            "What did the ocean say to the beach? Nothing, it just waved.",
            "Why did the math book look sad? Because it had too many problems!",
            "What do you call a sleeping bull? A dozer!",
            "How do you organize a space party? You planet!",
            "Why did the cookie go to the doctor? Because it felt crumbly!"
        ];

        function getJoke() {
            const randomIndex = Math.floor(Math.random() * jokes.length);
            document.getElementById('joke').textContent = jokes[randomIndex];
        }

        document.getElementById('jokeBtn').addEventListener('click', getJoke);
        window.onload = getJoke;
    </script>
</body>
</html>
